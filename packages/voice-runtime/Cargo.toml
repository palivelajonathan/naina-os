[package]
name = "voice-runtime"
version = "0.1.0"
edition = "2021"
description = "Voice processing engine and pipeline supervisor (Whisper STT & Piper TTS) for NAINA OS"

[dependencies]
runtime = { path = "../runtime" }
services = { path = "../services" }
configuration = { path = "../configuration" }
logging = { path = "../logging" }
model-runtime = { path = "../model-runtime" }
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
tokenizers = { version = "0.20", optional = true }

[features]
default = ["candle"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]
cuda = ["candle", "candle-core/cuda"]

[dev-dependencies]
kernel = { path = "../kernel" }
model-providers = { path = "../model-providers", features = ["llm-cuda"] }
model-runtime = { path = "../model-runtime" }
